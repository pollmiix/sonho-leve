<section class="customer-reviews" id="avaliacoes" aria-labelledby="reviews-title">
<h2 id="reviews-title">Avaliações de clientes</h2>
<div class="reviews-overview"><div class="reviews-score"><p class="reviews-average"><strong id="reviews-average">—</strong><span>/5</span></p><div class="reviews-stars" id="reviews-stars" aria-label="Ainda sem avaliações">★★★★★</div><p id="reviews-count">Ainda sem avaliações publicadas</p></div>
<div class="reviews-distribution" aria-label="Distribuição das avaliações"><div class="review-bar-row"><span>5 <span class="review-star">★</span></span><div class="review-track"><span id="review-bar-5" style="width:0%"></span></div><span class="review-bar-count" id="review-count-5">0</span></div><div class="review-bar-row"><span>4 <span class="review-star">★</span></span><div class="review-track"><span id="review-bar-4" style="width:0%"></span></div><span class="review-bar-count" id="review-count-4">0</span></div><div class="review-bar-row"><span>3 <span class="review-star">★</span></span><div class="review-track"><span id="review-bar-3" style="width:0%"></span></div><span class="review-bar-count" id="review-count-3">0</span></div><div class="review-bar-row"><span>2 <span class="review-star">★</span></span><div class="review-track"><span id="review-bar-2" style="width:0%"></span></div><span class="review-bar-count" id="review-count-2">0</span></div><div class="review-bar-row"><span>1 <span class="review-star">★</span></span><div class="review-track"><span id="review-bar-1" style="width:0%"></span></div><span class="review-bar-count" id="review-count-1">0</span></div></div>
<div class="reviews-action"><button type="button" id="open-review">Deixe uma avaliação</button><p id="review-draft-status" role="status"></p></div></div>
<div class="reviews-toolbar"><label for="reviews-sort">Organizar</label><select id="reviews-sort"><option value="recent">Mais recentes</option><option value="highest">Maior nota</option><option value="lowest">Menor nota</option></select></div>
<div id="reviews-list"><p class="reviews-empty">Este produto ainda não tem avaliações publicadas.</p></div>
</section>
<dialog id="review-dialog" class="review-dialog" aria-labelledby="review-dialog-title"><div class="review-dialog-top"><h2 id="review-dialog-title">Sua avaliação</h2><button type="button" id="close-review" aria-label="Fechar avaliação">×</button></div><p>Prepare sua avaliação da RelaxSound. O rascunho fica salvo somente neste navegador e ainda não será publicado.</p><form id="review-form"><fieldset class="review-rating"><legend>Sua nota</legend><label><input type="radio" name="rating" value="1" required><span>1 ★</span></label><label><input type="radio" name="rating" value="2" required><span>2 ★</span></label><label><input type="radio" name="rating" value="3" required><span>3 ★</span></label><label><input type="radio" name="rating" value="4" required><span>4 ★</span></label><label><input type="radio" name="rating" value="5" required><span>5 ★</span></label></fieldset><label class="review-field">Nome para exibição<input name="name" maxlength="60" autocomplete="nickname" placeholder="Como você quer ser identificado?" required></label><label class="review-field">Conte sua experiência<textarea name="comment" maxlength="1500" minlength="10" rows="4" placeholder="O que você achou do produto?" required></textarea></label><button class="save-review" type="submit">Salvar rascunho</button><p id="review-save-message" role="status"></p></form></dialog>
